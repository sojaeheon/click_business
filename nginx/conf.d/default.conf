server {
    listen 80;
    server_name localhost;

    # Docker 내장 DNS
    resolver 127.0.0.11 valid=30s;

    # 1. Jenkins
    # Jenkins가 --prefix=/jenkins 설정을 가지고 있으므로 그대로 전달합니다.
    location /jenkins/ {
        set $upstream_jenkins jenkins-server;
        proxy_pass http://$upstream_jenkins:8080; # 뒤에 경로(/jenkins/)를 붙이지 않습니다.

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Jenkins의 CSP(Content Security Policy) 이슈 방지 및 대용량 빌드 로그 지원
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 2. Production API
    location /api/ {
        set $upstream_backend backend-service;
        proxy_pass http://$upstream_backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Production Web
    location / {
        set $upstream_frontend frontend-app;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}