services:
  db:
    image: postgres:17
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ecosim
      POSTGRES_USER: ecosim
      POSTGRES_PASSWORD: ecosim
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - ecosim-network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx-router
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecosim-network

networks:
  ecosim-network:
    name: ecosim-network
    driver: bridge