services:
  frontend:
    build: ./frontend
    container_name: ecosim-frontend
    restart: always
    networks:
      - ecosim-network

  backend:
    build: ./backend
    container_name: ecosim-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./env/oltp.env
    depends_on:
      - postgres
      - redis
    networks:
      - ecosim-network

  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: always
    env_file:
      - ./env/oltp.env
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres_data:/var/lib/postgresql/data
    networks:
      - ecosim-network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis_data:/data
    command: redis-server --save "" --appendonly yes --appendfsync everysec
    networks:
      - ecosim-network

  order-redis-consumer:
    build:
      context: ./bigdata
      dockerfile: kafka/Dockerfile.kafka
    container_name: order-redis-consumer
    restart: always
    env_file:
      - ./env/oltp.env
    environment:
      CONSUMER_TYPE: order_redis
      KAFKA_ORDER_GROUP_ID: order-redis-consumer
      KAFKA_AUTO_OFFSET_RESET: earliest
    depends_on:
      - redis
    networks:
      - ecosim-network

  order-db-consumer:
    build:
      context: ./bigdata
      dockerfile: kafka/Dockerfile.kafka
    container_name: order-db-consumer
    restart: always
    env_file:
      - ./env/oltp.env
    environment:
      CONSUMER_TYPE: order_db
      KAFKA_ORDER_GROUP_ID: order-db-consumer
      KAFKA_AUTO_OFFSET_RESET: earliest
    depends_on:
      - postgres
    networks:
      - ecosim-network

  trade-db-consumer:
    build:
      context: ./bigdata
      dockerfile: kafka/Dockerfile.kafka
    container_name: trade-db-consumer
    restart: always
    env_file:
      - ./env/oltp.env
    environment:
      CONSUMER_TYPE: trade_db
      KAFKA_TRADE_GROUP_ID: trade-db-consumer
      KAFKA_AUTO_OFFSET_RESET: latest
    depends_on:
      - postgres
    networks:
      - ecosim-network

  nginx:
    image: nginx:stable-alpine
    container_name: ecosim-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ecosim-network

  jenkins:
    build: ./infra
    user: root
    container_name: jenkins
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./infra/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infra/jenkins_home:/var/jenkins_home
      - ./infra/jenkins.yaml:/var/jenkins_home/jenkins.yaml
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_OPTS=--prefix=/jenkins
      - CASC_JENKINS_CONFIG=/var/jenkins_home/jenkins.yaml
      - MM_WEBHOOK_URL
      - JENKINS_ADMIN_ID
      - JENKINS_ADMIN_PASSWORD
      - GITLAB_USERNAME
      - GITLAB_TOKEN
      - GITLAB_WEBHOOK_TOKEN
      - DOCKER_HUB_ID
      - DOCKER_HUB_PASSWORD
      - JENKINS_URL
      - KUBECONFIG_CONTENT
      - GIT_BRANCH
    networks:
      - ecosim-network

networks:
  ecosim-network:
    name: ecosim-network
    external: true
