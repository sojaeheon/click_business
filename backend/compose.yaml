services:
  # 애플리케이션 (Spring Boot)
  backend:
    build: .
    container_name: ecosim-backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/ecosim
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: http://j14b109.p.ssafy.io,http://15.165.236.217,http://localhost
      SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_GOOGLE_TOKEN_URI: https://oauth2.googleapis.com/token
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - ecosim-network

networks:
  ecosim-network:
    name: ecosim-network
    external: true
