server:
  port: 8000

spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecosim}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:ecosim}
    password: ${SPRING_DATASOURCE_PASSWORD:ecosim}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: 6379
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true  # V1 체크섬 불일치 자동 보정

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
  # autoconfigure:
  #   exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: profile, email

cors:
# 기본값으로 여러 개를 주고 싶을 때 (쉼표로 구분)
#  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://my-service.com}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:vmsrehkbuckettestbacktokenKeyforEcoSimulationProject2026SSAFY}
  expiration-time: 2592000000 # 30일 (테스트 편의를 위해 연장)

# 미니게임 보상 가중치 (아이템 이름: 가중치, 합계가 100이 되도록 맞출 것)
# 가중치를 수정하면 다음 서버 재시작부터 반영됩니다
minigame:
  rewards:
    - item-name: "초보 일꾼"
      weight: 70
    - item-name: "인벤토리 확장권"
      weight: 24.7
    - item-name: "창고 확장권"
      weight: 4.7
    - item-name: "견습 일꾼"
      weight: 0.4
    - item-name: "숙련 일꾼"
      weight: 0.18
    - item-name: "마스터 일꾼"
      weight: 0.01
    - item-name: "에픽 일꾼"
      weight: 0.009
    - item-name: "레전드 일꾼"
      weight: 0.001

# 창고 설정 (MATERIAL/PRODUCT)
warehouse:
  initial-slot-count: 6
  expand-slot-amount: 5
  max-stack-size: 100
  max-expandable-limit: 100

# 인벤토리 설정 (EQUIPMENT/TICKET)
inventory:
  initial-slot-count: 4

# API 요청 로그 출력 설정
logging:
  level:
    org.springframework.web: INFO
    org.flywaydb: INFO
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    com.ssafy.ecosim.domain.market.kafka: WARN
    com.ssafy.ecosim.domain.market.service: INFO # market 기능 로그 확인용
    # org.springframework.security: DEBUG (필요시 보안 필터 로그도 볼 수 있습니다)

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /api/swagger-ui.html
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs
  api-docs:
    path: /api/v3/api-docs
