server:
  port: 8000

spring:
  docker:
    compose:
      enabled: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecosim}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:ecosim}
    password: ${SPRING_DATASOURCE_PASSWORD:ecosim}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    repair-on-migrate: true  # V1 체크섬 불일치 자동 보정

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-client-secret}
            scope: profile, email

cors:
# 기본값으로 여러 개를 주고 싶을 때 (쉼표로 구분)
#  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://my-service.com}
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

jwt:
  secret: ${JWT_SECRET:vmsrehkbuckettestbacktokenKeyforEcoSimulationProject2026SSAFY}
  expiration-time: 2592000000 # 30일 (테스트 편의를 위해 연장)

# 창고 설정 (MATERIAL/PRODUCT)
warehouse:
  initial-slot-count: 6
  expand-slot-amount: 5
  max-stack-size: 100
  max-expandable-limit: 100

# 인벤토리 설정 (EQUIPMENT/TICKET)
inventory:
  initial-slot-count: 4

# API 요청 로그 출력 설정
logging:
  level:
    org.springframework.web: DEBUG
    org.flywaydb: DEBUG
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
    com.ssafy.ecosim.domain.market.kafka: WARN
    # org.springframework.security: DEBUG (필요시 보안 필터 로그도 볼 수 있습니다)

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    config-url: /api/v3/api-docs/swagger-config
    url: /api/v3/api-docs
