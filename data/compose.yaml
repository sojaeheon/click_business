services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_DB: ecosim
      POSTGRES_USER: ecosim
      POSTGRES_PASSWORD: ecosim
      # POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
      POSTGRES_HOST_AUTH_METHOD: trust # Docker 내부 접속 허용
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - ecosim-network

  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    networks:
      - ecosim-network

  # -----------------------------
  # ZooKeeper 서비스
  # -----------------------------
  zookeeper:
    # Confluent에서 제공하는 ZooKeeper 이미지
    image: confluentinc/cp-zookeeper:7.6.0
    
    # 컨테이너 이름 지정 (docker ps에서 보기 쉽게)
    container_name: zookeeper
    
    ports:
      # 호스트:컨테이너
      # ZooKeeper 기본 클라이언트 포트
      - "2181:2181"

    environment:
      # ZooKeeper 클라이언트 접속 포트
      ZOOKEEPER_CLIENT_PORT: 2181
      
      # ZooKeeper 내부 heartbeat tick 시간 (ms)
      # 클러스터에서 node 상태 체크 주기
      ZOOKEEPER_TICK_TIME: 2000

    networks:
      # Kafka와 통신하기 위한 Docker 네트워크
      - ecosim-network


  # -----------------------------
  # Kafka Broker 서비스
  # -----------------------------
  kafka:
    # Confluent Kafka 이미지
    image: confluentinc/cp-kafka:7.6.0
    
    # 컨테이너 이름
    container_name: kafka
    
    # zookeeper가 먼저 실행되도록 의존성 설정
    depends_on:
      - zookeeper

    ports:
      # Kafka client 접속 포트
      # Spring Boot / Python / Spark 등이 여기로 접속
      - "9092:9092"

    environment:

      # Kafka Broker ID
      # Kafka 클러스터에서 broker 식별용
      # 단일 브로커이므로 1
      KAFKA_BROKER_ID: 1

      # Kafka가 사용할 ZooKeeper 주소
      # docker 내부 네트워크에서 zookeeper:2181로 접근
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Kafka가 실제로 바인딩해서 듣는 주소
      # 0.0.0.0 = 모든 인터페이스
      # KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      # Kafka가 외부 client에게 광고하는 주소
      # Spring Boot가 localhost:9092로 접속
      # KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092 # 외부
      # KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092 # 내부
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      
      # consumer offset topic replication 설정
      # single broker이므로 1로 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      # ZooKeeper와 동일 네트워크
      - ecosim-network

  # -----------------------------
  # Kafka Topic Init
  # -----------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka-init
    depends_on:
      - kafka
    volumes:
      - ../bigdata/kafka/scripts/create_topics.sh:/usr/local/bin/create_topics.sh
    entrypoint: ["/bin/bash", "/usr/local/bin/create_topics.sh"]
    networks:
      - ecosim-network

  # -----------------------------
  # Kafka Consumer (Redis 적재용)
  # -----------------------------
  market-consumer:
    build:
      context: ../bigdata/kafka
      dockerfile: Dockerfile.kafka
    container_name: market-consumer
    restart: always
    depends_on:
      - kafka
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    networks:
      - ecosim-network
      
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    command:
      - "--kafka.server=kafka:29092"
    ports:
      - "9308:9308"
    networks:
      - ecosim-network

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - ecosim-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3001:3000"
    networks:
      - ecosim-network

networks:
  ecosim-network:
    name: ecosim-network
    external: true
