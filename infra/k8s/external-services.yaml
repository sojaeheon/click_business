# docker compose로 실행 중인 postgres/redis를 k8s 서비스로 노출
# IP는 startup.sh가 자동으로 채워줌 (POSTGRES_IP, REDIS_IP placeholder)
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-db
spec:
  ports:
  - port: 5432
---
apiVersion: v1
kind: Endpoints
metadata:
  name: postgres-db
subsets:
- addresses:
  - ip: POSTGRES_IP
  ports:
  - port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
  - port: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
subsets:
- addresses:
  - ip: REDIS_IP
  ports:
  - port: 6379
