apiVersion: apps/v1
kind: Deployment
metadata:
  name: s14p11b201-app
  labels:
    app: s14p11b201
spec:
  replicas: 3
  selector:
    matchLabels:
      app: s14p11b201
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: s14p11b201
    spec:
      containers:
      - name: app
        image: ${DOCKER_IMAGE}
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /actuator/health # 애플리케이션의 상태 체크 경로에 맞춰 수정 필요
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health # 애플리케이션의 상태 체크 경로에 맞춰 수정 필요
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: s14p11b201-service
spec:
  selector:
    app: s14p11b201
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
