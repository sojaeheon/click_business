apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # REST API
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      # WebSocket
      - path: /ws-ecosim
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      # OAuth2 인증 시작
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
      # OAuth2 Google 콜백 (Spring Security가 처리)
      - path: /login/oauth2
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
---
# Jenkins는 /jenkins/ prefix를 그대로 전달해야 하므로 별도 Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /jenkins
        pathType: Prefix
        backend:
          service:
            name: jenkins-service
            port:
              number: 8080
