server {
    listen 80;
    server_name localhost;

    # Docker 내장 DNS
    resolver 127.0.0.11 valid=30s;

    # 1. Jenkins
    # Jenkins가 --prefix=/jenkins 설정을 가지고 있으므로 그대로 전달합니다.
    # [수정] 변수를 쓰지 않고 직접 주소를 입력하여 /etc/hosts를 참조하게 합니다.
    location /jenkins/ {
        proxy_pass http://jenkins:8080/jenkins/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_redirect http://jenkins:8080/jenkins/ /jenkins/;

        # Jenkins 대용량 데이터 전송 최적화
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    # 2. OAuth2 (Spring Security)
    location /oauth2/ {
        set $upstream_backend ecosim-backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /login/ {
        set $upstream_backend ecosim-backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Production API
    location /api/ {
        set $upstream_backend ecosim-backend;
        proxy_pass http://$upstream_backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Production Web
    location / {
        set $upstream_frontend frontend-app;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}