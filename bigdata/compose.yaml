services:
  spark-master:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-master
    restart: unless-stopped
    cpus: "0.5"
    mem_limit: 768m
    volumes:
      - ./spark/jobs:/opt/spark-apps
      - spark-master-recovery:/opt/spark-recovery
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    env_file:
      - ../data/.env
    environment:
      SPARK_DAEMON_JAVA_OPTS: >-
        -Dspark.deploy.recoveryMode=FILESYSTEM
        -Dspark.deploy.recoveryDirectory=/opt/spark-recovery
    ports:
      - "7077:7077"
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ecosim-network

  spark-worker:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-worker
    restart: unless-stopped
    cpus: "4.0"
    mem_limit: 5g
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    env_file:
      - ../data/.env
    environment:
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=4g
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ecosim-network

  spark-worker-2:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-worker-2
    restart: unless-stopped
    cpus: "4.0"
    mem_limit: 5g
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    env_file:
      - ../data/.env
    environment:
      - SPARK_WORKER_CORES=3
      - SPARK_WORKER_MEMORY=4g
    ports:
      - "8083:8081"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081', timeout=2)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ecosim-network

  spark-market-news:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-market-news
    depends_on:
      - spark-master
      - spark-worker
      - spark-worker-2
    restart: unless-stopped
    cpus: "1.5"
    mem_limit: 2g
    volumes:
      - ./spark/jobs:/opt/spark-apps
      # Keep Spark's atomic checkpoint renames off the Windows bind mount.
      - spark-market-news-checkpoints:/opt/spark-checkpoints
    env_file:
      - ../data/.env
    command: >
      /bin/bash -lc '
      until (echo > /dev/tcp/spark-master/7077) >/dev/null 2>&1; do sleep 2; done;
      until (echo > /dev/tcp/namenode/9000) >/dev/null 2>&1; do sleep 2; done;
      until (echo > /dev/tcp/postgres-db/5432) >/dev/null 2>&1; do sleep 2; done;
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --total-executor-cores 1
      --executor-cores 1
      /opt/spark-apps/market_news_stream.py
      --trigger-interval "1 minute"
      --window-minutes 10
      --order-curated-path hdfs://namenode:9000/curated/kafka/topic=market.order.events
      --trade-curated-path hdfs://namenode:9000/curated/kafka/topic=market.trade.events
      --checkpoint-path /opt/spark-checkpoints/market-news-stream-v2
      '
    networks:
      - ecosim-network

  
  spark-submit-valuation:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-submit-valuation
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1536m
    depends_on:
      - spark-master
      - spark-worker
      - spark-worker-2
    volumes:
      - ./spark/jobs:/opt/spark-apps
      # Windows bind mounts can intermittently fail while Spark atomically
      # renames checkpoint files. Keep the recovery log in a Docker volume.
      - spark-valuation-checkpoints:/opt/spark-checkpoints
    env_file:
      - ../data/.env
    environment:
      # v1 checkpoint contains an incomplete offsets file after the Docker/WSL move.
      # Start from Kafka latest offsets using a clean, versioned checkpoint path.
      VALUATION_CHECKPOINT_LOCATION: /opt/spark-checkpoints/company-valuation-v2
    command: >
      /bin/bash -lc '
      until (echo > /dev/tcp/spark-master/7077) >/dev/null 2>&1; do sleep 2; done;
      until (echo > /dev/tcp/kafka/29092) >/dev/null 2>&1; do sleep 2; done;
      until (echo > /dev/tcp/postgres-db/5432) >/dev/null 2>&1; do sleep 2; done;
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --total-executor-cores 2
      --executor-cores 1
      /opt/spark-apps/company_valutation_stream.py
      '
    networks:
      - ecosim-network

  spark-hdfs-compactor:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-hdfs-compactor
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 1536m
    depends_on:
      - spark-master
      - spark-worker
      - spark-worker-2
    volumes:
      - ./spark/jobs:/opt/spark-apps
    env_file:
      - ../data/.env
    command:
      - /bin/bash
      - -lc
      - |
        until (echo > /dev/tcp/spark-master/7077) >/dev/null 2>&1; do sleep 2; done
        until (echo > /dev/tcp/namenode/9000) >/dev/null 2>&1; do sleep 2; done
        while true; do
          /opt/spark/bin/spark-submit \
            --master spark://spark-master:7077 \
            --total-executor-cores 1 \
            --executor-cores 1 \
            /opt/spark-apps/hdfs_parquet_compactor.py \
            --lookback-hours 24
          sleep 3600
        done
    networks:
      - ecosim-network

# -----------------------------
# Docker Network
# 컨테이너 간 이름 기반 통신 가능
# 예: kafka -> zookeeper:2181, spark -> namenode:9000
# -----------------------------
networks:
  ecosim-network:
    name: ecosim-network
    external: true

volumes:
  spark-master-recovery:
  spark-market-news-checkpoints:
  spark-valuation-checkpoints:
