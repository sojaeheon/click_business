services:
  spark-master:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    env_file:
      - ../data/.env  
    ports:
      - "7077:7077"
      - "8082:8080"
    networks:
      - ecosim-network

  spark-worker:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-worker
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    env_file:
      - ../data/.env
    ports:
      - "8081:8081"
    networks:
      - ecosim-network
  
  spark-submit-valuation:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-submit-valuation
    depends_on:
      - spark-master
      - spark-worker
    volumes:
      - ./spark/jobs:/opt/spark-apps
    env_file:
      - ../data/.env
    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /opt/spark-apps/company_valutation_stream.py
    networks:
      - ecosim-network

# -----------------------------
# Docker Network
# 컨테이너 간 이름 기반 통신 가능
# 예: kafka -> zookeeper:2181, spark -> namenode:9000
# -----------------------------
networks:
  ecosim-network:
    name: ecosim-network
    external: true