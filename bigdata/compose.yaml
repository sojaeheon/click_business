services:
  spark-master:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master
    env_file:
      - ../data/.env  
    ports:
      - "7077:7077"
      - "8082:8080"
    networks:
      - ecosim-network

  spark-worker:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-worker
    depends_on:
      - spark-master
    volumes:
      - ./spark/jobs:/opt/spark-apps
    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    env_file:
      - ../data/.env
    ports:
      - "8081:8081"
    networks:
      - ecosim-network

  spark-market-news:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-market-news
    depends_on:
      - spark-master
      - spark-worker
      - namenode
      - datanode
    restart: unless-stopped
    volumes:
      - ./spark/jobs:/opt/spark-apps
    command: >
      /bin/bash -lc '
      until (echo > /dev/tcp/spark-master/7077) >/dev/null 2>&1; do sleep 2; done;
      until (echo > /dev/tcp/namenode/9000) >/dev/null 2>&1; do sleep 2; done;
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      /opt/spark-apps/market_news_streaming.py
      --trigger-interval "10 minutes"
      --window-minutes 10
      --checkpoint-path /tmp/checkpoints/market-news-stream
      '
    networks:
      - ecosim-network

  # -----------------------------
  # HDFS NameNode
  # 파일 시스템 메타데이터 관리
  # -----------------------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode

    ports:
      # NameNode Web UI
      - "9870:9870"

      # HDFS client 접속 포트
      - "9000:9000"

    environment:
      # HDFS 클러스터 이름
      CLUSTER_NAME: ecosim-hdfs

    env_file:
      # Hadoop 환경 변수 파일
      - ./hdfs/conf/hadoop.env

    volumes:
      # NameNode 메타데이터 저장
      - ./hdfs/storage/namenode:/hadoop/dfs/name

      # 초기화 스크립트
      - ./hdfs/init:/init

      # 샘플 데이터 폴더
      - ./hdfs/sample-data:/sample-data

    networks:
      - ecosim-network

  # -----------------------------
  # HDFS DataNode
  # 실제 데이터 블록 저장
  # -----------------------------
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode

    depends_on:
      # NameNode 이후 실행
      - namenode

    ports:
      # DataNode Web UI
      - "9864:9864"

    environment:
      # NameNode 준비 후 실행
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hdfs/conf/hadoop.env

    volumes:
      # 실제 데이터 블록 저장
      - ./hdfs/storage/datanode:/hadoop/dfs/data

    networks:
      - ecosim-network

# -----------------------------
# Docker Network
# 컨테이너 간 이름 기반 통신 가능
# 예: kafka -> zookeeper:2181, spark -> namenode:9000
# -----------------------------
networks:
  ecosim-network:
    name: ecosim-network
    external: true
