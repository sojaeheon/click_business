services:

  spark-master:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-master

    volumes:
      - ./spark/jobs:/opt/spark-apps

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.master.Master

    ports:
      - "7077:7077"
      - "8080:8080"

    networks:
      - ecosim-network


  spark-worker:
    build:
      context: .
      dockerfile: ./spark/Dockerfile.spark
    container_name: spark-worker

    depends_on:
      - spark-master

    volumes:
      - ./spark/jobs:/opt/spark-apps

    command: >
      /opt/spark/bin/spark-class
      org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077

    ports:
      - "8081:8081"

    networks:
      - ecosim-network


networks:
  ecosim-network:
    # bridge 네트워크
    # 컨테이너끼리 이름 기반 통신 가능
    # driver: bridge
    name: ecosim-network
    external: true