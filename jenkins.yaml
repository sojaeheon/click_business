tool:
  git:
    installations:
      - name: "Default"
        home: "git" # 시스템 경로의 git을 사용

jenkins:
  systemMessage: "32GB SSAFY 서버 - 보안 자동화 설정 가동 중 🚀"
  
  # 관리자 계정 설정 (환경 변수 사용)
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"

  # 권한 설정: 관리자에게 모든 권한 부여
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "${JENKINS_ADMIN_ID}"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"

  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true # 프록시나 컨테이너 환경에서 호출할 때 필수

# GitLab 인증 정보 (Credentials) 자동 등록
credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "gitlab-auth" # Jenkinsfile에서 사용할 ID
              username: "${GITLAB_USERNAME}"
              password: "${GITLAB_TOKEN}" # .env의 토큰이 여기 주입됨
              description: "GitLab Private Token for Project"
          - usernamePassword:
              scope: GLOBAL
              id: "docker-hub-credentials"
              username: "${DOCKER_HUB_ID}"
              password: "${DOCKER_HUB_PASSWORD}"
              description: "Docker Hub Credentials"
          - string:
              scope: GLOBAL
              id: "k8s-kubeconfig"
              secret: "${KUBECONFIG_CONTENT}"
              description: "K8s Kubeconfig Content"

# 프로젝트(Job) 자동 생성
jobs:
  - script: >
      pipelineJob('S14P21B109-Practice-Pipeline') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://lab.ssafy.com/s14-bigdata-dist-sub1/S14P21B109.git')
                  credentials('gitlab-auth')
                }
                branches('*/test_infra')
                extensions {
                  cleanBeforeCheckout() // 빌드 전 폴더를 깨끗이 비웁니다.
                }
              }
            }
            scriptPath('Jenkinsfile') // 저장소 루트의 Jenkinsfile 읽기
          }
        }
      }

# Mattermost 알림 설정 (필요 시 플러그인 설정 추가)
unclassified:
  mattermostnotifier:
    endpoint: "${MM_WEBHOOK_URL}"
  gitLabConnectionConfig:
    connections:
      - name: "GitLab"
        url: "https://lab.ssafy.com"
        apiTokenId: "gitlab-auth" # credentials에 등록한 ID와 일치해야 함
        clientBuilderId: "autodetect" # 이 행을 추가하여 null 에러 해결
        # useAuthenticatedPostReceiveRoute 속성은 지원되지 않아 제거되었습니다.